<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Exhibition</title>
</head>
<body>
    <h1>Add New Exhibition</h1>
    <form action="addExhibition.php" method="post">
        <label>Exhibition Name:</label>
        <input type="text" name="exhibitionName" required><br><br>

        <label>Location ID:</label>
        <input type="number" name="location" required><br><br>

        <label>Start Date:</label>
        <input type="date" name="start" required><br><br>

        <label>End Date:</label>
        <input type="date" name="end" required><br><br>

		<label>Description:</label><br>
		<textarea name="description" rows="4" cols="40"></textarea><br><br>

        <h2>Add Artworks to Exhibit</h2>

        <label>Title:</label><br>
		<div id="artworks">
			<input type="search" name="artwork[]">
		</div>

		<br>
	
        <button type="button" onclick="addField()">Add Another Artwork</button>
		<br><br>

	<script>
	function addField() {
  		document.getElementById("artworks").innerHTML += 
       			'<input type="search" name="artwork[]"><br>';
	}
	</script>

        <button type="submit" name="submit" >Submit</button>
    </form>

    <p><a href="home.html"> Home </a></p>

</body>
</html>
